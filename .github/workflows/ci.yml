name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: bash -n deploy/*.sh deploy/homeassistant-addon/run.sh
      - run: ./deploy/package-homeassistant-addon.sh
      - run: docker build -t file-manager-homeassistant-test dist/homeassistant-addon
