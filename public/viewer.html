<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Manager - Viewer</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="viewer-layout">
      <section class="viewer-card">
        <header class="viewer-toolbar">
          <button id="backButton" type="button">Back</button>
          <h1 id="viewerTitle" class="viewer-title">Loading file...</h1>
        </header>
        <pre id="viewerContent" class="viewer-content">Loading...</pre>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="viewer.js"></script>
  </body>
</html>
