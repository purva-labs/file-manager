name: File Manager Agent
version: "1.0.0"
slug: file_manager_agent
description: Authenticated root file agent for the distributed File Manager hub
url: https://github.com/purva-labs/file-manager
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: true
map:
  - type: homeassistant_config
    read_only: false
    path: /host/homeassistant
  - type: local_apps
    read_only: false
    path: /host/addons
  - type: all_app_configs
    read_only: false
    path: /host/addon-configs
  - type: backup
    read_only: false
    path: /host/backups
  - type: media
    read_only: false
    path: /host/media
  - type: share
    read_only: false
    path: /host/share
  - type: ssl
    read_only: false
    path: /host/ssl
options:
  listen_host: 192.168.68.114
  port: 3091
schema:
  listen_host: str
  port: port
